spring.application.name=affiliateLink


spring.datasource.url=jdbc:postgresql://localhost:5432/affiliatelink
spring.config.import=optional:file:./.env[.properties]
spring.datasource.username=affiliatelink
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.docker.compose.enabled=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


logging.level.root=INFO
logging.level.com.affiliatelink=DEBUG

logging.file.name=logs/affiliatelink.log

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n