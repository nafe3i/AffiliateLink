services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: affiliatelink
      POSTGRES_USER: affiliatelink
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U affiliatelink -d affiliatelink" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: